services:
  # Infra-only by default (best for IntelliJ local backend run)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: satorn-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-satorn}
      POSTGRES_USER: ${DB_USER:-satorn_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-satorn_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-satorn_user} -d ${DB_NAME:-satorn}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - satorn-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: satorn-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
      redis-server --appendonly yes;
      fi'
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - satorn-network
    restart: unless-stopped

  # Optional: run backend in Docker too
  satorn:
    profiles: ["fullstack"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satorn-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-satorn}
      DB_USER: ${DB_USER:-satorn_user}
      DB_PASSWORD: ${DB_PASSWORD:-satorn_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production-environment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080,http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-development}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - satorn-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  satorn-network:
    driver: bridge
